<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17324d"><link rel="manifest" href="./manifest.webmanifest">
<title>التدريب والإيفادات</title>
<style>
body{font-family:Tahoma;margin:0;background:#f3f6f8;color:#17212b}header{background:#17324d;color:white;padding:18px}nav{display:flex;gap:5px;overflow:auto;background:white;padding:8px;position:sticky;top:0}button{padding:10px;border:0;border-radius:8px;background:#1769aa;color:white;font:inherit}main{max-width:1100px;margin:auto;padding:12px}.page{display:none}.active{display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.card{background:white;padding:15px;border-radius:10px}.num{font-size:28px;font-weight:bold;color:#1769aa}.panel{background:white;padding:15px;margin:10px 0;border-radius:10px}input,select,textarea{width:100%;padding:9px;margin:4px 0 10px;box-sizing:border-box;font:inherit}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:right}.modal{display:none;position:fixed;inset:0;background:#0008;padding:15px}.modal>div{background:white;padding:18px;border-radius:12px;max-width:700px;margin:20px auto}.install{display:none;background:#e8f3ff;padding:10px;margin:10px 0;border-radius:8px}@media(max-width:600px){.cards{grid-template-columns:1fr 1fr}table{font-size:12px}}
</style></head><body>
<header><h2>📚 التدريب والإيفادات</h2><div>الدورات والكتب والإجراءات والمتابعة</div></header>
<nav><button onclick="show('home')">الرئيسية</button><button onclick="show('courses')">الدورات</button><button onclick="show('books')">الكتب</button><button onclick="show('calendar')">التقويم</button><button onclick="show('follow')">المتابعة</button><button onclick="show('backup')">النسخ الاحتياطي</button></nav>
<main>
<div id="install" class="install">📱 <b>تثبيت التطبيق</b> <button onclick="install()">تثبيت</button></div>
<section id="home" class="page active"><div class="cards"><div class="card">الدورات<div id="nc" class="num">0</div></div><div class="card">القادمة<div id="nu" class="num">0</div></div><div class="card">الكتب<div id="nb" class="num">0</div></div><div class="card">متابعة<div id="nf" class="num">0</div></div></div><div class="panel"><button onclick="course()">+ دورة</button> <button onclick="book()">+ كتاب</button></div><div class="panel"><h3>الدورات القادمة</h3><div id="up"></div></div></section>
<section id="courses" class="page"><div class="panel"><button onclick="course()">+ إضافة دورة</button><input id="cq" placeholder="بحث" oninput="render()"><div style="overflow:auto"><table><thead><tr><th>الدورة</th><th>الفترة</th><th>الحالة</th><th>الكتب</th><th></th></tr></thead><tbody id="ct"></tbody></table></div></div></section>
<section id="books" class="page"><div class="panel"><button onclick="book()">+ إضافة كتاب</button><input id="bq" placeholder="بحث" oninput="render()"><div style="overflow:auto"><table><thead><tr><th>الكتاب</th><th>الدورة</th><th>الموضوع</th><th>الإجراء</th><th>المتابعة</th><th></th></tr></thead><tbody id="bt"></tbody></table></div></div></section>
<section id="calendar" class="page"><div class="panel"><button onclick="cm(-1)">‹</button> <b id="ctitle"></b> <button onclick="cm(1)">›</button><div id="cal"></div></div></section>
<section id="follow" class="page"><div class="panel"><h3>الكتب التي تحتاج متابعة</h3><div id="fl"></div></div></section>
<section id="backup" class="page"><div class="panel"><button onclick="backup()">تصدير نسخة احتياطية</button> <button onclick="document.getElementById('file').click()">استرجاع</button><input id="file" type="file" accept=".json" hidden onchange="restore(event)"></div></section>
</main><div id="modal" class="modal"><div id="form"></div></div>
<script>
let D=JSON.parse(localStorage.getItem('tev')||'{"courses":[],"books":[]}'), M=new Date();M.setDate(1),deferred;
const save=()=>{localStorage.setItem('tev',JSON.stringify(D));render()},id=()=>Date.now()+Math.random(),today=()=>new Date().toISOString().slice(0,10);
if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js');
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;install.style.display='block'});
async function install(){if(deferred){deferred.prompt();await deferred.userChoice;deferred=null}else alert('من قائمة Chrome اختر إضافة إلى الشاشة الرئيسية أو تثبيت التطبيق')}
function show(x){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));document.getElementById(x).classList.add('active');render()}
function close(){modal.style.display='none'}function open(){modal.style.display='block'}
function course(cid=''){let c=D.courses.find(x=>x.id==cid)||{};form.innerHTML=`<h3>${cid?'تعديل':'إضافة'} دورة</h3>
اسم الدورة*<input id="n" value="${c.name||''}">الجهة<input id="o" value="${c.org||''}">المكان<input id="p" value="${c.place||''}">
البداية<input id="s" type="date" value="${c.start||''}">النهاية<input id="e" type="date" value="${c.end||''}">
التنبيه<select id="r"><option value="0">عند البدء</option><option value="1">قبل يوم</option><option value="3">قبل 3 أيام</option><option value="7">قبل أسبوع</option><option value="99">بدون</option></select>
ملاحظات<textarea id="m">${c.notes||''}</textarea><button onclick="saveCourse('${cid}')">حفظ</button> <button onclick="close()">إلغاء</button>`;open()}
function saveCourse(cid){if(!n.value.trim())return alert('اسم الدورة مطلوب');let x={id:cid||id(),name:n.value,org:o.value,place:p.value,start:s.value,end:e.value,reminder:+r.value,notes:m.value};if(cid)D.courses[D.courses.findIndex(a=>a.id==cid)]=x;else D.courses.push(x);close();save()}
function book(bid=''){let b=D.books.find(x=>x.id==bid)||{},opts=D.courses.map(c=>`<option value="${c.id}" ${b.courseId==c.id?'selected':''}>${c.name}</option>`).join('');form.innerHTML=`<h3>${bid?'تعديل':'إضافة'} كتاب</h3>رقم الكتاب*<input id="no" value="${b.no||''}">التاريخ<input id="dt" type="date" value="${b.date||''}">الدورة<select id="ci"><option value="">بدون</option>${opts}</select>الموضوع<input id="su" value="${b.subject||''}">الإجراء<input id="ac" value="${b.action||''}">المتابعة<select id="fo"><option>لا تحتاج متابعة</option><option>تحتاج متابعة</option><option>بانتظار الإجابة</option><option>مكتمل</option></select>ملاحظات<textarea id="bm">${b.notes||''}</textarea><button onclick="saveBook('${bid}')">حفظ</button> <button onclick="close()">إلغاء</button>`;open()}
function saveBook(bid){if(!no.value.trim())return alert('رقم الكتاب مطلوب');let x={id:bid||id(),no:no.value,date:dt.value,courseId:ci.value,subject:su.value,action:ac.value,follow:fo.value,notes:bm.value};if(bid)D.books[D.books.findIndex(a=>a.id==bid)]=x;else D.books.push(x);close();save()}
function del(t,i){if(!confirm('حذف؟'))return;if(t=='c')D.courses=D.courses.filter(x=>x.id!=i);else D.books=D.books.filter(x=>x.id!=i);save()}
function cname(i){return D.courses.find(x=>x.id==i)?.name||'—'}
function render(){nc.textContent=D.courses.length;nb.textContent=D.books.length;let U=D.courses.filter(x=>x.start>=today()).sort((a,b)=>a.start.localeCompare(b.start));nu.textContent=U.length;nf.textContent=D.books.filter(x=>x.follow=='تحتاج متابعة'||x.follow=='بانتظار الإجابة').length;up.innerHTML=U.slice(0,8).map(x=>`<p>📅 ${x.start} — <b>${x.name}</b></p>`).join('')||'لا توجد';let q=(cq?.value||'').toLowerCase();ct.innerHTML=D.courses.filter(x=>(x.name+x.org+x.place).toLowerCase().includes(q)).map(x=>`<tr><td>${x.name}<br>${x.org||''}</td><td>${x.start||'—'} → ${x.end||'—'}</td><td>${x.start>today()?'قادمة':x.end&&x.end<today()?'منتهية':'مستمرة'}</td><td>${D.books.filter(b=>b.courseId==x.id).length}</td><td><button onclick="course('${x.id}')">تعديل</button> <button onclick="del('c','${x.id}')">حذف</button></td></tr>`).join('');let bqv=(bq?.value||'').toLowerCase();bt.innerHTML=D.books.filter(b=>(b.no+b.subject+cname(b.courseId)).toLowerCase().includes(bqv)).map(b=>`<tr><td>${b.no}<br>${b.date||''}</td><td>${cname(b.courseId)}</td><td>${b.subject||''}</td><td>${b.action||''}</td><td>${b.follow||''}</td><td><button onclick="book('${b.id}')">تعديل</button> <button onclick="del('b','${b.id}')">حذف</button></td></tr>`).join('');fl.innerHTML=D.books.filter(b=>b.follow=='تحتاج متابعة'||b.follow=='بانتظار الإجابة').map(b=>`<p>📌 كتاب ${b.no} — ${b.subject} — ${b.follow} <button onclick="book('${b.id}')">فتح</button></p>`).join('')||'لا يوجد';calendar()}
function calendar(){let y=M.getFullYear(),m=M.getMonth(),days=new Date(y,m+1,0).getDate();ctitle.textContent=`${y}/${m+1}`;let h='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">';for(let d=1;d<=days;d++){let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;h+=`<div style="background:white;padding:8px;min-height:55px;border:1px solid #ddd"><b>${d}</b>${D.courses.filter(c=>c.start==ds).map(c=>`<small style="display:block">${c.name}</small>`).join('')}</div>`}cal.innerHTML=h+'</div>'}
function cm(n){M.setMonth(M.getMonth()+n);calendar()}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='التدريب-والايفادات.json';a.click()}
function restore(e){let r=new FileReader();r.onload=()=>{D=JSON.parse(r.result);save()};r.readAsText(e.target.files[0])}
render();
</script></body></html>
